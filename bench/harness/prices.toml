# API-equivalent list prices, USD per 1M tokens, used to price subscription runs.
# Claude Code reports its own API-equivalent cost (result.total_cost_usd); these prices are for
# Codex (which reports tokens only) and the optional minimal agent.

[openai."gpt-6.1-sol"]
status = "final"
date = "2026-10-19"
source = "https://developers.openai.com/api/docs/pricing (Standard tier)"
input = 2.00          # uncached input
cached_input = 0.10
cache_write = 2.50    # codex 0.163 turn.completed reports cache_write_input_tokens (0 so far);
                      # priced at this rate when non-zero, else everything uncached is "input"
output = 10.00        # reasoning tokens are part of output and priced once
# Long context: requests with > 272K input tokens
long_context_threshold = 272000
long_input = 4.00
long_cached_input = 0.20
long_cache_write = 5.00
long_output = 15.00

[openai."gpt-6-luna"]
status = "final"
date = "2026-10-21"
source = "https://developers.openai.com/api/docs/pricing (Standard tier)"
input = 0.10
cached_input = 0.01
cache_write = 0.125   # 30-minute cache write, as for gpt-6.1-sol
output = 0.50
long_context_threshold = 272000
long_input = 0.20
long_cached_input = 0.02
long_cache_write = 0.25
long_output = 0.75

[anthropic."claude-opus-5-5"]
# The optional minimal agent (paid API, off by default) is unpriced: its cost is recorded as
# null (unknown), never estimated.
status = "unpriced"
